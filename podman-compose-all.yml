version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: stockbs_db
    restart: always
    environment:
      POSTGRES_DB: stockbs
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: passw0rd!
      TZ: Asia/Seoul
    ports:
      - "5438:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d stockbs"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockbs_backend
    restart: always
    ports:
      - "8099:8099"
    environment:
      - DATABASE_URL=postgresql://admin:passw0rd!@db:5432/stockbs
      - GEMINI_API_KEY=${GEMINI_API_KEY:-YOUR_GEMINI_API_KEY}

      - SUBTITLE_DIR=/app/storage/subtitles
      - TZ=Asia/Seoul
    volumes:
      - subtitle_storage:/app/storage/subtitles
    depends_on:
      db:
        condition: service_healthy

  collector:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockbs_collector
    command: python -m app.services.collector_daemon
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:passw0rd!@db:5432/stockbs
      - SUBTITLE_DIR=/app/storage/subtitles
      - TZ=Asia/Seoul
    volumes:
      - subtitle_storage:/app/storage/subtitles
    depends_on:
      db:
        condition: service_healthy

  summarizer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockbs_summarizer
    command: python -m app.services.summarizer_daemon
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:passw0rd!@db:5432/stockbs
      - GEMINI_API_KEY=${GEMINI_API_KEY:-YOUR_GEMINI_API_KEY}

      - SUBTITLE_DIR=/app/storage/subtitles
      - TZ=Asia/Seoul
    volumes:
      - subtitle_storage:/app/storage/subtitles
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockbs_frontend
    restart: always
    ports:
      - "8090:80"
    environment:
      - TZ=Asia/Seoul
    depends_on:
      - backend

  kospi200_collector:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockbs_kospi200_collector
    command: python -m app.services.kospi200_daemon
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:passw0rd!@db:5432/stockbs
      - TZ=Asia/Seoul
    depends_on:
      db:
        condition: service_healthy

volumes:
  subtitle_storage:

